[package]
name = "sl-dbtools"
version = "0.1.0"

description = "Lightweight database migration utility"
license.workspace = true
repository.workspace = true
edition.workspace = true
readme = "../../README.md"

authors = ["cogs <cogs@springless.com>"]
keywords = ["database", "migration", "postgres", "sql"]
categories = ["database", "development-tools"]

[[bin]]
name = "sldb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dotenv = "0.15.0"
log = "0.4.35"
md5 = "0.8.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-native-tls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml", "redactions"] }
async-std = { version = "1.13.2", features = ["unstable"] }
